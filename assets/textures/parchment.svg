<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.42"/>
    </feComponentTransfer>
  </filter>
  <filter id="blotch" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="21" result="b"/>
    <feColorMatrix in="b" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.30"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="600" fill="#efe4cc"/>
  <rect width="600" height="600" filter="url(#blotch)" opacity="0.55" fill="#8a6a3c"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.30"/>
</svg>
